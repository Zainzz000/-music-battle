<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网易云64首歌淘汰赛</title>
<style>

:root{--bg:#101319;--p:#181e27;--c:#222a35;--l:#3b4654;--t:#f5f7fa;--m:#9aa6b3;--r:#ec4141;--r2:#542426;--g:#45d08a;--gold:#e6b94b;--blue:#62a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.w{padding:18px;max-width:1600px;margin:auto}h1{margin:0 0 5px}.sub,.muted{color:var(--m);font-size:13px}
.bar,.tools,.modebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px;margin:13px 0;border:1px solid var(--l);border-radius:12px;background:var(--p)}
button,input,select{font:inherit}.btn{padding:9px 12px;border:1px solid var(--l);border-radius:9px;background:var(--c);color:var(--t);cursor:pointer}.red{background:var(--r2);border-color:var(--r)}.active{border-color:var(--r);background:var(--r2)}.pill{padding:7px 10px;border:1px solid var(--l);border-radius:99px;color:var(--m)}.ok{color:var(--g)}.err{color:#ff7777}.tools input{flex:1;min-width:210px;padding:10px;border:1px solid var(--l);border-radius:9px;background:var(--c);color:var(--t)}select{background:var(--c);color:var(--t);border:1px solid var(--l);padding:9px;border-radius:9px}
.now{display:none;margin:10px 0;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--p)}.now.show{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:9px}.match{border:1px solid var(--l);background:var(--p);border-radius:11px;padding:8px}.songrow{display:flex;gap:5px;margin:4px 0}.pick{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick.win{background:var(--r2);border-color:var(--r);font-weight:800}.mini{width:38px;padding:0}
.roundhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:8px;border-bottom:1px solid var(--l);text-align:left}.rank tr.top8{background:#292616}.lockq{color:var(--g);font-weight:700}.locke{color:#ff7777;font-weight:700}
.classicwrap{overflow:auto;border:1px solid var(--l);border-radius:13px;background:var(--p)}.classic{min-width:1420px;padding:14px;display:grid;grid-template-columns:235px 195px 185px 175px 165px 155px 150px;gap:10px}.round{display:flex;flex-direction:column}.rtitle{text-align:center;font-weight:800;padding:8px;border:1px solid var(--l);border-radius:9px;background:var(--c);margin-bottom:6px}.matches{height:100%;display:flex;flex-direction:column;justify-content:space-around;gap:5px}.cmatch{min-height:65px;padding:4px;border:1px solid var(--l);border-radius:8px;background:var(--c);display:flex;flex-direction:column;justify-content:center;gap:3px}.csong{display:flex;gap:3px}.cname{flex:1;min-width:0;padding:5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--t);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cname.sel{background:var(--r2);border-color:var(--r);font-weight:800}.cmini{width:31px;padding:0;border:1px solid var(--l);border-radius:6px;background:transparent;color:var(--t);cursor:pointer}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;overflow:auto}.bcol{min-width:210px}.btitle{text-align:center;font-weight:800;padding:8px;background:var(--c);border-radius:8px;margin-bottom:8px}.bmatches{display:flex;flex-direction:column;justify-content:space-around;height:520px;gap:10px}.champ{text-align:center;font-size:25px;font-weight:900;color:var(--gold)}
.note{font-size:12px;color:var(--m);line-height:1.5;margin-top:10px}

/* Refined visual system */
:root{--bg:#0b0c10;--p:#14161d;--c:#1b1e27;--l:#2a2e3a;--t:#f6f7fb;--m:#858c9b;--r:#f04b60;--r2:#3b1b29;--g:#5ed9a6;--gold:#ffd47b}
body{background:radial-gradient(ellipse 70% 30% at 50% -10%,#2d1827 0%,transparent 85%),var(--bg);min-height:100vh}
.w{max-width:1240px;padding:clamp(20px,4vw,54px) clamp(16px,3vw,32px) 80px}
h1{font-size:clamp(29px,4vw,46px);font-weight:850;letter-spacing:-1.7px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
h1 em{font-style:normal;color:#ff6d7c}h1 .brand{color:#ff6d7c;font-size:1.1em}h1 .tag{font-size:12px;letter-spacing:0;padding:4px 8px;border-radius:7px;background:#35202b;color:#ff9ca6;align-self:center}
.sub{font-size:14px;margin:8px 0 32px;letter-spacing:.4px}
.modebox,.tools{border:1px solid var(--l);background:rgba(22,24,32,.92);border-radius:18px;padding:12px;gap:10px;margin:14px 0}
.modebox{display:flex;align-items:center;width:fit-content;max-width:100%;margin-bottom:18px}
.btn{border:1px solid #323644;background:#20232d;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:600;transition:background .22s ease,border-color .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;cursor:pointer}
.btn:hover{background:#2c3040;border-color:#555b70;transform:translateY(-2px);box-shadow:0 7px 18px #0003}
.btn:active{transform:scale(.97);box-shadow:none}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #ff8492;outline-offset:3px}
.btn.active,.btn.red{background:linear-gradient(135deg,#f55369,#d93d58);border-color:#fa6c7e;color:white;box-shadow:0 6px 20px #e8445933}
.btn.active:hover,.btn.red:hover{background:linear-gradient(135deg,#ff6e7f,#ed4964);box-shadow:0 9px 28px #e8445955}
.searchbar{padding:9px;display:flex;flex-wrap:nowrap;max-width:900px}
.searchbar input{min-width:0;flex:1;border:0;background:transparent;font-size:16px;padding:13px 15px;outline:none;color:white}
.searchbar input:focus-visible{outline:none}
.searchbar:focus-within{border-color:#b34b66;box-shadow:0 0 0 3px #f04b6017}
.searchbar .btn{white-space:nowrap;padding:13px 20px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}.actions .btn{color:#b7bdca;background:transparent;font-size:13px;padding:9px 13px}
.manualpanel{max-width:900px;padding:15px;background:var(--p);border:1px solid var(--l);border-radius:16px;animation:reveal .28s ease both}.manualpanel[hidden]{display:none}
.manualpanel textarea{display:block;width:100%;resize:vertical;background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}
#status{min-height:22px;margin:10px 2px 22px;font-size:13px;line-height:1.6}#status:empty{display:none}
.match,.classicwrap,.cmatch{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}.match:hover,.cmatch:hover{border-color:#4c5061}.match{border-radius:15px;padding:12px}.grid{gap:12px}
.pick.win,.cname.sel{background:linear-gradient(110deg,#512132,#38202e);border-color:#f35b73}
.now{border-radius:14px;padding:12px 16px}.roundhead{margin:24px 0 16px}.roundhead h2{letter-spacing:-.5px}
#view{animation:reveal .4s ease both}select{border-radius:9px}#swissOptions{gap:12px;align-items:center;flex-wrap:wrap}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){.w{padding:24px 14px 60px}.modebox{width:100%;gap:7px}.modebox>.btn{flex:1;padding:11px 8px;font-size:12px}.searchbar .btn{font-size:13px;padding:12px}.searchbar input{padding:12px 6px}.grid{grid-template-columns:1fr}.sub{margin-bottom:24px}h1{font-size:30px}.actions{gap:4px}.actions .btn{font-size:12px;padding:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.btn.loading{opacity:.7;cursor:wait;pointer-events:none}

/* The artist field is owned by the user; never hydrate its value from saved match state. */
.searchbar{position:relative}
.searchbar input[type=search]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.searchbar input::-webkit-search-cancel-button{display:none}
.clear-artist{flex:none;border:0;background:transparent;color:#9ca3af;cursor:pointer;font-size:25px;line-height:1;padding:5px 9px;border-radius:9px;transition:color .18s,transform .18s,background .18s}
.clear-artist:hover{color:#fff;background:#ffffff12;transform:scale(1.08)}
.clear-artist:active{transform:scale(.92)}
.clear-artist[hidden]{display:none}

.classicwrap{border-radius:18px;box-shadow:0 20px 60px #0004}.classic{min-width:1680px;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px}.cmatch{border-radius:10px}.cname{font-size:12px}.rtitle{font-size:13px;letter-spacing:.5px}.actions .btn:first-child{background:linear-gradient(135deg,#f55369,#c83c72);color:white;border-color:transparent;box-shadow:0 6px 22px #ef446033}.actions .btn:first-child:hover{transform:translateY(-2px)}.roundhead{margin-top:20px}
</style></head><body><div class="w">
<h1><span class="brand">♫</span> MUSIC <em>BATTLE</em><span class="tag">64</span></h1>
<div class="sub">64 首歌 · 1 位冠军</div>

<div class="tools searchbar"><input id="artist" type="search" placeholder="输入歌手名称，如 周杰伦" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button id="clearArtist" class="clear-artist" type="button" aria-label="清空歌手名称" title="清空">×</button><button id="search" class="btn red">搜索并开始 <span aria-hidden="true">↗</span></button></div><div class="actions"><button id="exportPng" class="btn">↓ 导出完整赛程 PNG</button><button id="exportSvg" class="btn">SVG</button><button id="exportTier" class="btn red">↓ 导出夯到拉排行榜</button><button id="restart" class="btn">↻ 重新开始</button><button id="clear" class="btn">清除存档</button><button id="toggleManual" class="btn">导入歌单 <span id="chevron">⌄</span></button></div>
<div id="manualPanel" class="manualpanel" hidden><textarea id="manual" rows="4" placeholder="每行一首，共64首。例如：晴天 - 周杰伦"></textarea><button id="import" class="btn red">使用歌单开始</button></div><p id="status" class="muted" role="status" aria-live="polite"></p>
<div id="now" class="now"><button id="stop" class="btn">■ 停止</button><span id="nowtext"></span></div>
<div id="subtabs"></div><div id="view"></div><audio id="audio"></audio>
</div>
<script>
const SAVE_CLASSIC='shareClassic64_v1';
let ext=false,seq=1,pending=new Map(),audio=document.querySelector('#audio'),timer=null;
let songs=[];
let C={artist:'',songs:[],winners:Array.from({length:6},()=>[])};

const $=s=>document.querySelector(s);
// 国内部署时使用同源 /api/search。
const API_BASE = ''; // Optional default; on Vercel the built-in /api/search is used automatically.

const getApiBase = () => (localStorage.getItem('musicBattleApiBase') || API_BASE || (location.protocol.startsWith('http') ? location.origin : '')).replace(/\/$/, '');

async function bridge(action,payload={}){
  if(action==='ping')return {loggedIn:false};
  if(action==='search'){
    const artist=String(payload.artist||'').trim();
    if(!artist)throw Error('请输入歌手名称');
    const base=getApiBase();
    if(!base)throw Error('请通过已部署的网址打开游戏');
    const r=await fetch(base+'/api/search?artist='+encodeURIComponent(artist),{signal:AbortSignal.timeout(25000)});
    let d;try{d=await r.json()}catch{throw Error('搜索接口未部署或返回网页，请确认 Cloudflare Pages Functions 已部署')}
    if(!r.ok)throw Error(d?.error||'搜索接口错误 HTTP '+r.status);
    return {songs:d.songs||[]};
  }
  if(action==='playurl'){
    const id=String(payload.id||'');
    if(id.startsWith('manual'))throw Error('手动导入的歌曲请点 ↗ 前往网易云');
    return {url:'https://music.163.com/song/media/outer/url?id='+encodeURIComponent(id)+'.mp3',level:'网易云公开音源（可能因版权或跨域无法播放）'};
  }
  if(action==='chorus')return {data:null};
  throw Error('不支持的操作');
}
function msg(x,bad=false){$('#status').textContent=x;$('#status').className='muted '+(bad?'err':'')}
$('#toggleManual').onclick=()=>{const p=$('#manualPanel');p.hidden=!p.hidden;$('#chevron').textContent=p.hidden?'⌄':'⌃'};
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
function stop(){clearTimeout(timer);audio.pause();audio.removeAttribute('src');audio.load();$('#now').classList.remove('show')}
function chorusStart(o,d){let nums=[];(function walk(x,k=''){if(x==null)return;if(typeof x==='number'&&/start/i.test(k))nums.push(x);else if(typeof x==='object')Object.entries(x).forEach(([a,b])=>walk(b,a))})(o);let v=nums.find(x=>x>=0);return v==null?(d||240000)/1000*.62:v>10000?v/1000:v}
async function play(t,hot){stop();try{let p=await bridge('playurl',{id:t.id});if(!p.url)throw Error('没有播放地址');audio.src=p.url;await audio.play();if(hot){timer=setTimeout(stop,30000)}$('#nowtext').textContent=(hot?'🔥 ':'▶ ')+t.title+' · '+(p.level||'可用音质');$('#now').classList.add('show')}catch(e){msg('播放失败：'+e.message,true)}}$('#stop').onclick=stop;

function saveClassic(){localStorage.setItem(SAVE_CLASSIC,JSON.stringify(C))}
function loadAll(){try{let x=JSON.parse(localStorage.getItem(SAVE_CLASSIC));if(x?.songs?.length===64)C=x}catch{}}

async function searchSongs(artist){
  const d=await bridge('search',{artist}),target=norm(artist);
  let all=(d.songs||[]).map(s=>({id:s.id,title:s.name,author:(s.artists||[]).join(' / '),duration:s.duration||0,preview:s.preview||'',link:s.link||'',cover:s.cover||''}));
  let strict=all.filter(x=>{let a=norm(x.author);return a&&(a.includes(target)||target.includes(a))});
  const seen=new Set(),out=[];for(const x of strict){let k=norm(x.title).replace(/[^\p{L}\p{N}]/gu,'')+'|'+norm(x.author);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=64)break}
  if(out.length<64)throw Error('搜索到 '+out.length+' 首匹配歌曲；本赛制要求64首，请尝试更完整的歌手曲库或使用歌单导入。');
  return out
}

$('#search').onclick=async()=>{
  const artist=$('#artist').value.trim();if(!artist)return msg('请输入歌手名称',true);const btn=$('#search');btn.disabled=true;btn.classList.add('loading');msg('正在搜索「'+artist+'」…');
  try{
    const out=await searchSongs(artist);
    C={artist,songs:out,winners:Array.from({length:6},()=>[])};saveClassic();renderClassic();msg('64 首歌曲已就位。')
  }catch(e){msg('搜索失败：'+e.message,true)}finally{btn.disabled=false;btn.classList.remove('loading')}
};
// Search text is never derived from saved artist or rerendered tournament state.
const artistField=$('#artist'),clearArtist=$('#clearArtist');
function updateClearArtist(){clearArtist.hidden=!artistField.value.length}
artistField.addEventListener('input',updateClearArtist);
artistField.addEventListener('change',updateClearArtist);
clearArtist.addEventListener('click',()=>{artistField.value='';artistField.dispatchEvent(new Event('input',{bubbles:true}));artistField.focus()});
artistField.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#search').click()}});
updateClearArtist();
$('#import').onclick=()=>{
 const lines=$('#manual').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(lines.length!==64)return msg('请粘贴恰好64首歌（每行一首），当前 '+lines.length+' 首。',true);
 const artist=$('#artist').value.trim()||'自定义歌单';
 const out=lines.map((line,i)=>{const parts=line.split(/\s+[-—–]\s+/);const title=(parts[0]||'').trim();const author=parts.slice(1).join(' - ')||artist;return{id:'manual'+i,title,author,duration:0,preview:'',link:'https://music.163.com/#/search/m/?s='+encodeURIComponent(title+' '+author)}});
 C={artist,songs:out,winners:Array.from({length:6},()=>[])};saveClassic();renderClassic();
 msg('已从歌单生成64首歌曲。点击 ↗ 可在网易云搜索播放。');
};


$('#restart').onclick=()=>{if(!C.songs.length)return;if(!confirm('重新开始本届比赛？'))return;C.winners=Array.from({length:6},()=>[]);saveClassic();renderClassic();msg('已重新开始。')};
$('#clear').onclick=()=>{if(!confirm('删除当前比赛和存档？'))return;localStorage.removeItem(SAVE_CLASSIC);C={artist:'',songs:[],winners:Array.from({length:6},()=>[])};renderClassic();msg('存档已清除。')};

function classicEntrants(r){return r===0?C.songs:C.winners[r-1]}
function classicPick(r,i,t){C.winners[r][i]=t;for(let x=r+1;x<6;x++)C.winners[x][Math.floor(i/2**(x-r))]=undefined;saveClassic();renderClassic()}
function classicRow(t,r,i,w){const row=document.createElement('div');row.className='csong';const b=document.createElement('button');b.className='cname '+((w?.id===t.id)?'sel':'');b.textContent=t.title;b.title=t.title+' — '+t.author;b.onclick=()=>classicPick(r,i,t);const p=document.createElement('button');p.className='cmini';p.textContent='▶';p.onclick=()=>play(t,false);const h=document.createElement('button');h.className='cmini';h.textContent='🔥';h.onclick=()=>play(t,true);row.append(b,p,h);if(t.link){let l=document.createElement('a');l.href=t.link;l.target='_blank';l.rel='noopener';l.textContent='↗';l.title='打开曲目页面';row.append(l)}return row}
function renderClassic(){
  $('#subtabs').innerHTML='';const v=$('#view');v.innerHTML='';
  if(!C.songs.length){v.innerHTML='<p class=muted>搜索歌手，开始你的 64 强淘汰赛。</p>';return}
  const wrap=document.createElement('div');wrap.className='classicwrap';const B=document.createElement('div');B.className='classic';const labels=['64强','32强','16强','8强','4强','决赛','冠军'];
  for(let r=0;r<7;r++){const c=document.createElement('section');c.className='round';const h=document.createElement('div');h.className='rtitle';h.textContent=labels[r];c.append(h);const s=document.createElement('div');s.className='matches';
    if(r===6){const m=document.createElement('div');m.className='cmatch';m.textContent=C.winners[5]?.[0]?.title||'等待冠军产生';s.append(m)}
    else{const a=classicEntrants(r),cnt=32/2**r;for(let i=0;i<cnt;i++){const m=document.createElement('div');m.className='cmatch';[a[i*2],a[i*2+1]].forEach(t=>{if(t)m.append(classicRow(t,r,i,C.winners[r][i]))});s.append(m)}}
    c.append(s);B.append(c)
  }
  wrap.append(B);v.append(wrap)
}

function esc(x){let d=document.createElement('div');d.textContent=x;return d.innerHTML}


/* Full bracket poster: native SVG elements, no third-party scripts or external fonts. */
const posterEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const posterShort=(s,n=16)=>{s=String(s||'—');return [...s].length>n?[...s].slice(0,n-1).join('')+'…':s};
function posterSVG(){
 if(C.songs.length!==64)throw Error('请先生成64首歌曲');
 const W=2540,H=2420,left=58,top=290,colW=334,gap=18,baseY=350,step=58;
 const labels=['ROUND OF 64','ROUND OF 32','SWEET 16','QUARTERFINALS','SEMIFINALS','FINAL','CHAMPION'];
 let out=[`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
 `<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151923"/><stop offset="1" stop-color="#080a0f"/></linearGradient><linearGradient id="accent" x2="1" y2="0"><stop stop-color="#ff7289"/><stop offset="1" stop-color="#b94476"/></linearGradient></defs>`,
 `<rect width="${W}" height="${H}" fill="url(#bg)"/><rect x="58" y="64" width="8" height="112" rx="4" fill="url(#accent)"/>`,
 `<text x="88" y="116" font-size="48" font-weight="800" fill="#f9f6fa" font-family="sans-serif">MUSIC BATTLE</text>`,
 `<text x="88" y="166" font-size="28" fill="#d0b4c0" font-family="sans-serif">${posterEscape(C.artist||'64 SONGS')} · 64 SONGS / ONE WINNER</text>`,
 `<text x="${W-58}" y="116" text-anchor="end" font-size="27" fill="#ff8fa3" font-family="sans-serif">TOURNAMENT BRACKET</text>`,
 `<path d="M58 205 H${W-58}" stroke="#41404c" stroke-width="2"/>`];
 const box=(x,y,w,h,fill,stroke='#383744',r=12)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
 const txt=(x,y,text,color='#e7e7ef',size=20,weight=500)=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-weight="${weight}" font-family="sans-serif">${posterEscape(text)}</text>`;
 for(let r=0;r<7;r++){
  const x=left+r*(colW+gap),count=r===6?1:32>>r;
  out.push(txt(x+8,262,labels[r],'#f58b9d',21,750));
  for(let i=0;i<count;i++){
   const h=r===0?53:Math.min(150,step*2**r-12);
   const cy=baseY+(i+.5)*step*2**r-step/2;
   const y=cy-h/2;
   const w=colW-8;
   out.push(box(x,y,w,h,r===6?'#382330':'#1e222c',r===6?'#f47591':'#353a48'));
   if(r===6){const champion=C.winners[5]?.[0];out.push(txt(x+15,cy+8,champion?'★ '+posterShort(champion.title,17):'等待冠军','#ffd38b',25,750));continue}
   const arr=classicEntrants(r),winner=C.winners[r]?.[i];
   const a=arr?.[2*i],b=arr?.[2*i+1];
   if(r===0){
    out.push(txt(x+12,cy-5,posterShort(a?.title||'—',19),winner?.id===a?.id?'#ffb0c1':'#f0f1f5',18,winner?.id===a?.id?800:500));
    out.push(`<path d="M${x+12} ${cy+1} H${x+w-12}" stroke="#373b47"/>`);
    out.push(txt(x+12,cy+20,posterShort(b?.title||'—',19),winner?.id===b?.id?'#ffb0c1':'#a6abb7',18,winner?.id===b?.id?800:500));
   }else{
    out.push(txt(x+12,cy-6,posterShort(a?.title||'—',18),winner?.id===a?.id?'#ffb0c1':'#eff0f5',20,winner?.id===a?.id?800:500));
    out.push(`<path d="M${x+12} ${cy+1} H${x+w-12}" stroke="#373b47"/>`);
    out.push(txt(x+12,cy+24,posterShort(b?.title||'—',18),winner?.id===b?.id?'#ffb0c1':'#a6abb7',20,winner?.id===b?.id?800:500));
   }
  }
 }
 out.push(txt(58,H-38,'64 SONGS · 6 ROUNDS · 1 CHAMPION','#81818f',20));
 out.push('</svg>');return out.join('');
}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function posterName(ext){return 'Music-Battle-'+(C.artist||'64').replace(/[\\/:*?"<>|]/g,'').slice(0,32)+'.'+ext}
/* '夯到拉' tier list is based only on recorded bracket results. */
function tierGroups(){
 if(C.songs.length!==64)throw Error('请先生成64首歌曲');
 const tiers=[{name:'夯',sub:'CHAMPION',color:'#ffba64',items:[]},{name:'顶级',sub:'RUNNER-UP',color:'#ff879f',items:[]},{name:'人上人',sub:'TOP 4',color:'#e4a2f8',items:[]},{name:'还行',sub:'TOP 8',color:'#9cb6ff',items:[]},{name:'NPC',sub:'TOP 16',color:'#9acfd2',items:[]},{name:'拉',sub:'TOP 32',color:'#b1b7c4',items:[]},{name:'拉完了',sub:'ROUND OF 64',color:'#858b9a',items:[]}];
 const eliminated=new Set();
 for(let r=0;r<6;r++){
  const entrants=classicEntrants(r);
  for(let i=0;i<32/2**r;i++){
   const a=entrants[2*i],b=entrants[2*i+1],w=C.winners[r]?.[i];
   if(!a||!b||!w)continue;
   const loser=w.id===a.id?b:w.id===b.id?a:null;
   if(loser){tiers[6-r].items.push(loser);eliminated.add(String(loser.id))}
  }
 }
 const champion=C.winners[5]?.[0];
 if(champion){tiers[0].items.push(champion);eliminated.add(String(champion.id))}
 const pending=C.songs.filter(t=>!eliminated.has(String(t.id)));
 return {tiers,pending};
}
function tierSVG(covers={}){
 const {tiers,pending}=tierGroups();
 const W=1720,margin=64,inner=W-2*margin,gap=12,header=218,footer=92;
 const cardW=154,cardH=194,cols=9,cardGap=12,left=margin+196;
 const rowHeight=items=>Math.max(122,30+Math.ceil(items.length/cols)*(cardH+cardGap));
 const heights=tiers.map(t=>rowHeight(t.items));
 const pendingH=pending.length?rowHeight(pending):0;
 const H=header+heights.reduce((a,b)=>a+b+gap,0)+(pending.length?pendingH+gap:0)+footer;
 const esc=posterEscape;
 const out=[`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
 '<defs><linearGradient id="tierbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1b2b"/><stop offset=".52" stop-color="#11121b"/><stop offset="1" stop-color="#08090f"/></linearGradient><linearGradient id="coverFallback" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54314b"/><stop offset="1" stop-color="#262c49"/></linearGradient></defs>',
 `<rect width="${W}" height="${H}" fill="url(#tierbg)"/>`,
 `<circle cx="${W-100}" cy="80" r="250" fill="#e4547d" opacity=".055"/>`,
 `<text x="${margin}" y="96" fill="#faf8fc" font-size="67" font-weight="900" font-family="sans-serif">从夯到拉</text>`,
 `<text x="${margin}" y="151" fill="#afb3c4" font-size="27" font-family="sans-serif">${esc(posterShort(C.artist||'MUSIC BATTLE',40))} · 64 SONG TIER LIST</text>`,
 `<text x="${W-margin}" y="94" text-anchor="end" fill="#fa87a4" font-size="26" font-weight="800" font-family="sans-serif">MUSIC BATTLE / 64</text>`,
 `<path d="M${margin} 183 H${W-margin}" stroke="#363747" stroke-width="2"/>`];
 let y=header;
 function row(t,h){
  const {name,sub,color,items}=t;
  out.push(`<rect x="${margin}" y="${y}" width="${inner}" height="${h}" rx="17" fill="#1c1e2a" stroke="#343747" stroke-width="2"/>`);
  out.push(`<path d="M${margin+174} ${y} H${margin+174} V${y+h}" stroke="#343747" stroke-width="2"/>`);
  out.push(`<rect x="${margin}" y="${y}" width="174" height="${h}" rx="17" fill="${color}"/>`);
  out.push(`<rect x="${margin+156}" y="${y}" width="18" height="${h}" fill="${color}"/>`);
  out.push(`<text x="${margin+87}" y="${y+h/2-14}" text-anchor="middle" fill="#1b1b24" font-size="41" font-weight="900" font-family="sans-serif">${esc(name)}</text>`);
  out.push(`<text x="${margin+87}" y="${y+h/2+18}" text-anchor="middle" fill="#37313c" font-size="15" font-weight="750" font-family="sans-serif">${esc(sub)}</text>`);
  items.forEach((song,i)=>{
   const x=left+(i%cols)*(cardW+cardGap),cy=y+16+Math.floor(i/cols)*(cardH+cardGap);
   const cover=covers[String(song.id)];
   out.push(`<rect x="${x}" y="${cy}" width="${cardW}" height="${cardH}" rx="10" fill="#292d3a"/>`);
   out.push(`<rect x="${x+5}" y="${cy+5}" width="${cardW-10}" height="${cardW-10}" rx="7" fill="url(#coverFallback)"/>`);
   if(cover){out.push(`<image x="${x+5}" y="${cy+5}" width="${cardW-10}" height="${cardW-10}" preserveAspectRatio="xMidYMid slice" href="${cover}"/>`)}
   else {out.push(`<text x="${x+cardW/2}" y="${cy+86}" text-anchor="middle" fill="#ffffff88" font-size="46" font-weight="800" font-family="sans-serif">♫</text>`)}
   out.push(`<text x="${x+9}" y="${cy+174}" fill="#f5f5fa" font-size="16" font-weight="650" font-family="sans-serif">${esc(posterShort(song.title,9))}</text>`);
  });
  y+=h+gap;
 }
 tiers.forEach((t,i)=>row(t,heights[i]));
 if(pending.length)row({name:'待定',sub:'IN PLAY',color:'#e3d3a9',items:pending},pendingH);
 out.push(`<text x="${margin}" y="${H-37}" fill="#8b8e9f" font-size="22" font-family="sans-serif">淘汰赛成绩自动分档 · 同档不分先后 · ${pending.length?'比赛进行中':'比赛已完成'}</text>`);
 out.push('</svg>');return {svg:out.join(''),width:W,height:H};
}
async function loadTierCovers(){
 const {tiers,pending}=tierGroups();const items=[...tiers.flatMap(t=>t.items),...pending];
 const covers={};let next=0;
 async function worker(){while(next<items.length){const song=items[next++];if(!song.cover)continue;
  try{const r=await fetch(song.cover,{mode:'cors',signal:AbortSignal.timeout(2800)});if(!r.ok)continue;
   const blob=await r.blob();if(!blob.type.startsWith('image/')||blob.size>1500000)continue;
   const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});
   covers[String(song.id)]=data;
  }catch{} }
 }
 await Promise.all(Array.from({length:6},worker));return covers;
}
$('#exportTier').onclick=async()=>{
 const b=$('#exportTier');b.disabled=true;b.textContent='正在生成排行榜…';
 try{
  const covers=await loadTierCovers();const {svg,width,height}=tierSVG(covers);
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
   const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
   const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('无法创建图片画布');ctx.drawImage(img,0,0);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
   if(!blob)throw Error('PNG 生成失败');
   saveBlob(blob,'夯到拉排行榜-'+(C.artist||'64首').replace(/[\\/:*?"<>|]/g,'').slice(0,30)+'.png');
   msg('排行榜图片已导出。');
  }finally{URL.revokeObjectURL(url)}
 }catch(e){msg('排行榜导出失败：'+e.message,true)}
 finally{b.disabled=false;b.textContent='↓ 导出夯到拉排行榜'}
};

$('#exportSvg').onclick=()=>{try{saveBlob(new Blob([posterSVG()],{type:'image/svg+xml;charset=utf-8'}),posterName('svg'));msg('高清 SVG 已导出。')}catch(e){msg(e.message,true)}};
$('#exportPng').onclick=async()=>{const b=$('#exportPng');b.disabled=true;b.textContent='正在生成…';try{
 const svg=posterSVG(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=document.createElement('canvas');c.width=2540;c.height=2420;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG 编码失败');saveBlob(blob,posterName('png'));msg('完整赛程图已导出。')}finally{URL.revokeObjectURL(url)}
 }catch(e){msg('PNG 导出失败：'+e.message+'。可改用 SVG 导出。',true)}finally{b.disabled=false;b.textContent='↓ 导出完整赛程 PNG'}};

loadAll();renderClassic();
setTimeout(()=>{void 0},1500);
</script></body></html>
