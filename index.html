<script>
const SAVE_CLASSIC='shareClassic64_v1';
let ext=false,seq=1,pending=new Map();
const officialPlayer=document.querySelector('#officialPlayer');
let songs=[];
let C={artist:'',songs:[],winners:Array.from({length:6},()=>[])};
let S={artist:'',songs:[],rounds:[]},mode='classic';

const $=s=>document.querySelector(s);
const SAVE_SWISS='shareSwiss32_v1';
// 国内部署时使用同源 /api/search。
const API_BASE = ''; // Optional default; on Vercel the built-in /api/search is used automatically.

const getApiBase = () => (localStorage.getItem('musicBattleApiBase') || API_BASE || (location.protocol.startsWith('http') ? location.origin : '')).replace(/\/$/, '');

async function bridge(action,payload={}){
  if(action==='ping')return {loggedIn:false};
  if(action==='search'){
    const artist=String(payload.artist||'').trim();
    if(!artist)throw Error('请输入歌手名称');
    const base=getApiBase();
    if(!base)throw Error('请通过已部署的网址打开游戏');
    const r=await fetch(base+'/api/search?artist='+encodeURIComponent(artist),{signal:AbortSignal.timeout(25000)});
    let d;try{d=await r.json()}catch{throw Error('搜索接口未部署或返回网页，请确认 Cloudflare Pages Functions 已部署')}
    if(!r.ok)throw Error(d?.error||'搜索接口错误 HTTP '+r.status);
    return {songs:d.songs||[]};
  }
  if(action==='chorus')return {data:null};
  throw Error('不支持的操作');
}
function msg(x,bad=false){$('#status').textContent=x;$('#status').className='muted '+(bad?'err':'')}
$('#toggleManual').onclick=()=>{const p=$('#manualPanel');p.hidden=!p.hidden;$('#chevron').textContent=p.hidden?'⌄':'⌃'};
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
/* SWISS_LOGIC_START */
function swissFirstRound(songs,random=Math.random){
 const shuffled=songs.slice();
 for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
 return Array.from({length:shuffled.length/2},(_,i)=>({a:String(shuffled[i*2].id),b:String(shuffled[i*2+1].id),winner:null}));
}
function swissHistory(rounds){
 const wins=new Map(),opponents=new Map();
 for(const round of rounds)for(const match of round){
  const a=String(match.a),b=String(match.b);
  if(!wins.has(a))wins.set(a,0);if(!wins.has(b))wins.set(b,0);
  if(!opponents.has(a))opponents.set(a,new Set());if(!opponents.has(b))opponents.set(b,new Set());
  opponents.get(a).add(b);opponents.get(b).add(a);
  if(match.winner===a||match.winner===b)wins.set(String(match.winner),wins.get(String(match.winner))+1);
 }
 return {wins,opponents};
}
function swissRank(songs,rounds){
 const {wins,opponents}=swissHistory(rounds);
 return songs.map((song,seed)=>{
  const id=String(song.id),buchholz=[...(opponents.get(id)||[])].reduce((sum,opponent)=>sum+(wins.get(opponent)||0),0);
  return {song,wins:wins.get(id)||0,buchholz,seed};
 }).sort((a,b)=>b.wins-a.wins||b.buchholz-a.buchholz||a.seed-b.seed);
}
function swissNextRound(songs,rounds){
 const standings=swissRank(songs,rounds),{opponents}=swissHistory(rounds),n=standings.length;
 const played=new Set();
 for(const [a,opps] of opponents)for(const b of opps)played.add([a,b].sort().join(':'));
 for(let maxGap=0;maxGap<=5;maxGap++){
  const memo=new Map();
  function pair(mask){
   if(mask===0n)return [];
   if(memo.has(mask))return memo.get(mask);
   const active=[];for(let i=0;i<n;i++)if(mask&(1n<<BigInt(i)))active.push(i);
   let first=-1,options=null;
   for(const i of active){
    const candidates=active.filter(j=>j!==i&&Math.abs(standings[i].wins-standings[j].wins)<=maxGap&&!played.has([String(standings[i].song.id),String(standings[j].song.id)].sort().join(':')))
     .sort((a,b)=>Math.abs(standings[i].wins-standings[a].wins)-Math.abs(standings[i].wins-standings[b].wins)||Math.abs(i-a)-Math.abs(i-b)||a-b);
    if(options===null||candidates.length<options.length){first=i;options=candidates;if(!options.length)break}
   }
   for(const j of options||[]){const rest=pair(mask^(1n<<BigInt(first))^(1n<<BigInt(j)));if(rest){const result=[[String(standings[first].song.id),String(standings[j].song.id)],...rest];memo.set(mask,result);return result}}
   memo.set(mask,null);return null;
  }
  const pairs=pair((1n<<BigInt(n))-1n);
  if(pairs)return pairs.map(([a,b])=>({a,b,winner:null}));
 }
 throw Error('无法在避免重复对阵的前提下生成下一轮');
}

async function searchSongs(artist,count){
  const d=await bridge('search',{artist}),target=norm(artist);

  let strict=all.filter(x=>{let a=norm(x.author);return a&&(a.includes(target)||target.includes(a))});
  const seen=new Set(),out=[];for(const x of strict){let k=norm(x.title).replace(/[^\p{L}\p{N}]/gu,'')+'|'+norm(x.author);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=count)break}
  if(out.length<count)throw Error('搜索到 '+out.length+' 首匹配歌曲；当前赛制需要 '+count+' 首，请尝试更完整的歌手曲库。');

}

function tierGroups(){
 if(S.songs.length!==32||!swissComplete())throw Error('完成五轮瑞士轮后才能导出排名图');
 const ranked=swissRank(S.songs,S.rounds),bands=[['夯','第 1 名','#d8b47c',1],['顶级','第 2 名','#d18b9a',1],['人上人','第 3–4 名','#bc9bc9',2],['还行','第 5–8 名','#91a9c4',4],['NPC','第 9–16 名','#8baead',8],['拉','第 17–32 名','#9299a6',16]];
 let offset=0;const tiers=bands.map(([name,sub,color,size])=>{const items=ranked.slice(offset,offset+size).map(x=>x.song);offset+=size;return{name,sub,color,items}});
 return {tiers,pending:[]};
}
function tierSVG(covers={}){
 const {tiers,pending}=tierGroups();
 const W=1720,margin=64,inner=W-2*margin,gap=12,header=218,footer=92;
 const cardW=154,cardH=194,cols=8,cardGap=12,left=margin+196;
 const rowHeight=items=>Math.max(122,30+Math.ceil(items.length/cols)*(cardH+cardGap));
 const heights=tiers.map(t=>rowHeight(t.items));
 const pendingH=pending.length?rowHeight(pending):0;
 const H=header+heights.reduce((a,b)=>a+b+gap,0)+(pending.length?pendingH+gap:0)+footer;
 const esc=posterEscape;
 const out=[`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
 '<defs><linearGradient id="tierbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f7f8"/><stop offset="1" stop-color="#ececef"/></linearGradient><linearGradient id="coverFallback" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1d8d7"/><stop offset="1" stop-color="#e6e4e7"/></linearGradient></defs>',
 `<rect width="${W}" height="${H}" fill="url(#tierbg)"/>`,
 `<circle cx="${W-100}" cy="80" r="250" fill="#e54845" opacity=".06"/>`,
 `<text x="${margin}" y="96" fill="#29292d" font-size="67" font-weight="900" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">从夯到拉</text>`,
 `<text x="${margin}" y="151" fill="#77787d" font-size="27" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">${esc(posterShort(S.artist||'MUSIC BATTLE',40))} · 32 SONG SWISS RANKING</text>`,
 `<text x="${W-margin}" y="94" text-anchor="end" fill="#d94a47" font-size="26" font-weight="800" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,-apple-system,BlinkMacSystemFont,sans-serif">MUSIC BATTLE / 32</text>`,
 `<path d="M${margin} 183 H${W-margin}" stroke="#dedee1" stroke-width="2"/>`];
 let y=header;
 function row(t,h){
  const {name,sub,color,items}=t;
  out.push(`<rect x="${margin}" y="${y}" width="${inner}" height="${h}" rx="17" fill="#fff" stroke="#e2e3e5" stroke-width="2"/>`);
  out.push(`<path d="M${margin+174} ${y} H${margin+174} V${y+h}" stroke="#e2e3e5" stroke-width="2"/>`);
  out.push(`<rect x="${margin}" y="${y}" width="174" height="${h}" rx="17" fill="${color}"/>`);
  out.push(`<rect x="${margin+156}" y="${y}" width="18" height="${h}" fill="${color}"/>`);
  out.push(`<text x="${margin+87}" y="${y+h/2-14}" text-anchor="middle" fill="#35353a" font-size="41" font-weight="900" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">${esc(name)}</text>`);
  out.push(`<text x="${margin+87}" y="${y+h/2+18}" text-anchor="middle" fill="#58585e" font-size="15" font-weight="750" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">${esc(sub)}</text>`);
  items.forEach((song,i)=>{
   const x=left+(i%cols)*(cardW+cardGap),cy=y+16+Math.floor(i/cols)*(cardH+cardGap);
   const cover=covers[String(song.id)];
   out.push(`<rect x="${x}" y="${cy}" width="${cardW}" height="${cardH}" rx="10" fill="#fff" stroke="#e6e6e8"/>`);
   out.push(`<rect x="${x+5}" y="${cy+5}" width="${cardW-10}" height="${cardW-10}" rx="7" fill="url(#coverFallback)"/>`);
   if(cover){out.push(`<image x="${x+5}" y="${cy+5}" width="${cardW-10}" height="${cardW-10}" preserveAspectRatio="xMidYMid slice" href="${cover}"/>`)}
   else {out.push(`<text x="${x+cardW/2}" y="${cy+86}" text-anchor="middle" fill="#d94a47" font-size="46" font-weight="800" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">♫</text>`)}
   out.push(`<text x="${x+9}" y="${cy+174}" fill="#38383d" font-size="16" font-weight="650" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">${esc(posterShort(song.title,9))}</text>`);
  });
  y+=h+gap;
 }
 tiers.forEach((t,i)=>row(t,heights[i]));
 if(pending.length)row({name:'待定',sub:'IN PLAY',color:'#e3d3a9',items:pending},pendingH);
 out.push(`<text x="${margin}" y="${H-37}" fill="#85868b" font-size="22" font-family="Hiragino Sans GB,PingFang SC,Microsoft YaHei,sans-serif">瑞士轮完成 · 5 轮 · 胜场优先，对手分破同分</text>`);
 out.push('</svg>');return {svg:out.join(''),width:W,height:H};
}
async function loadTierCovers(){
 const {tiers,pending}=tierGroups();const items=[...tiers.flatMap(t=>t.items),...pending];
 const covers={};let next=0;
 async function worker(){while(next<items.length){const song=items[next++];if(!song.cover)continue;
  try{const r=await fetch(song.cover,{mode:'cors',signal:AbortSignal.timeout(2800)});if(!r.ok)continue;
   const blob=await r.blob();if(!blob.type.startsWith('image/')||blob.size>1500000)continue;
   const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});
   covers[String(song.id)]=data;
  }catch{} }
 }
 await Promise.all(Array.from({length:6},worker));return covers;
}
$('#exportTier').onclick=async()=>{
 const b=$('#exportTier');b.disabled=true;b.textContent='正在生成排行榜…';
 try{
  const covers=await loadTierCovers();const {svg,width,height}=tierSVG(covers);
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
   const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
   const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('无法创建图片画布');ctx.drawImage(img,0,0);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
   if(!blob)throw Error('PNG 生成失败');
   saveBlob(blob,'夯到拉排行榜-'+(S.artist||'32首').replace(/[\\/:*?"<>|]/g,'').slice(0,30)+'.png');
   msg('排行榜图片已导出。');
  }finally{URL.revokeObjectURL(url)}
 }catch(e){msg('排行榜导出失败：'+e.message,true)}
 finally{b.disabled=false;b.textContent='↓ 导出夯到拉排行榜'}
};

$('#exportSvg').onclick=()=>{try{saveBlob(new Blob([posterSVG()],{type:'image/svg+xml;charset=utf-8'}),posterName('svg'));msg('高清 SVG 已导出。')}catch(e){msg(e.message,true)}};
$('#exportPng').onclick=async()=>{const b=$('#exportPng');b.disabled=true;b.textContent='正在生成…';try{
 const svg=posterSVG(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=document.createElement('canvas');c.width=2700;c.height=3400;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG 编码失败');saveBlob(blob,posterName('png'));msg('完整赛程图已导出。')}finally{URL.revokeObjectURL(url)}
 }catch(e){msg('PNG 导出失败：'+e.message+'。可改用 SVG 导出。',true)}finally{b.disabled=false;b.textContent='↓ 导出完整赛程 PNG'}};

loadAll();renderActive();
setTimeout(()=>{void 0},1500);
</script></body></html>
